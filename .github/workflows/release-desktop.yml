name: Release Desktop

# Pushing a `desktop-v*` tag is the whole release process. The CLI has its own
# tag line (`cli-v*`) and its own workflow, so the two versions never collide.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build for a dry run (no release is created)'
        required: true
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes are generated from the previous desktop-v* tag,
          # which needs the full tag history.
          fetch-depth: 0

      - name: Resolve version
        id: version
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG=""
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#desktop-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Notes start at the previous desktop release, so CLI tags in between
          # don't drag unrelated commits into the changelog.
          # `|| true` because grep exits 1 when nothing is left — which is the
          # normal case for the first tag of a line, and would otherwise abort
          # the step under the runner's `set -eo pipefail`.
          PREV=$(git tag -l 'desktop-v*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (tag '$TAG', previous '$PREV')"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/python/requirements.txt

      - name: Install Python backend dependencies
        run: python -m pip install --upgrade pip pyinstaller -r python/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Stamp version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build the Python sidecar
        run: npm run build:python

      - name: Typecheck and build the app
        run: npm run build

      - name: Package
        # Never `--publish`: electron-builder can only tag `v${version}`, and our
        # tags are prefixed. The upload below puts the artifacts on our own tag.
        run: npx electron-builder --win --publish never

      - name: Verify artifacts
        run: |
          missing=0
          for f in dist/latest.yml \
                   dist/universal-downloader-desktop-${{ steps.version.outputs.version }}-setup.exe \
                   dist/universal-downloader-desktop-${{ steps.version.outputs.version }}-portable.exe; do
            if [ ! -f "$f" ]; then echo "::error::missing artifact: $f"; missing=1; fi
          done
          # Without latest.yml every installed app is cut off from updates, so a
          # release must never go out without it.
          [ "$missing" = "0" ] || exit 1
          echo "--- latest.yml ---"
          cat dist/latest.yml

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ steps.version.outputs.version }}
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_ARG=""
          if [ -n "${{ steps.version.outputs.prev }}" ]; then
            NOTES_ARG="--notes-start-tag ${{ steps.version.outputs.prev }}"
          fi
          # The .blockmap lets electron-updater download only the changed parts
          # of the installer instead of the whole 130 MB.
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --title "Desktop v${{ steps.version.outputs.version }}" \
            --generate-notes $NOTES_ARG \
            dist/universal-downloader-desktop-${{ steps.version.outputs.version }}-setup.exe \
            dist/universal-downloader-desktop-${{ steps.version.outputs.version }}-portable.exe \
            dist/universal-downloader-desktop-${{ steps.version.outputs.version }}-setup.exe.blockmap \
            dist/latest.yml

      - name: Summary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo "### Desktop v${{ steps.version.outputs.version }} — draft created"
            echo ""
            echo "Review it, then publish. **Users only see the update once the draft is published.**"
          } >> "$GITHUB_STEP_SUMMARY"
