<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Universal Downloader</title>
    <!--
      Strict by default. `img-src https:` is the one relaxation: video thumbnails
      are loaded straight from the platforms' CDNs.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
